name: 现金自动化资格核查

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cash_audit.py"
      - "tests/test_cash_audit.py"
      - ".github/workflows/cash-audit.yml"
  schedule:
    # 每周一，北京时间 09:41
    - cron: "41 1 * * 1"

permissions:
  contents: write

concurrency:
  group: cash-eligibility-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行全部离线单元测试
        run: python -m unittest discover -s tests -v
      - name: 只读读取官方规则并更新报告
        run: python cash_audit.py
      - name: 保存资格报告
        run: bash -n scripts/publish-report.sh && bash scripts/publish-report.sh reports/cash-eligibility.md
